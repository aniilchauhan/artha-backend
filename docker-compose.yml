version: "3.8"

services:
  axion-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set}
    container_name: axion-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL must be set}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - APP_URL=${APP_URL:?APP_URL must be set}
      - ADMIN_EMAILS=${ADMIN_EMAILS:?ADMIN_EMAILS must be set}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - PYTHON_PATH=/opt/venv/bin/python
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    depends_on:
      - mongo
      - ollama
    volumes:
      - axion_outputs:/app/stock-ai/outputs

  ollama:
    image: ollama/ollama:latest
    container_name: axion-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: >
      /bin/sh -lc "ollama serve & sleep 5; ollama pull ${OLLAMA_MODEL:-qwen2.5:7b-instruct}; wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7.0
    container_name: axion-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  ollama_data:
  axion_outputs:
